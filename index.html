<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f7fb" />
  <title>Informado</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <h1>Today</h1>
        <p>What matters today — ranked by executive impact</p>
      </div>
      <div class="source-pill">
        <span class="status-dot"></span>
        Sources · 28 active
      </div>
    </header>

    <section class="filters" aria-label="Dashboard filters">
      <div class="select-grid">
        <label class="select-wrap">
          <span class="sr-only">Topic</span>
          <select id="topicSelect">
            <option value="all">🌐 All topics</option>
            <option value="payments" selected>💳 Payments</option>
            <option value="banks">🏦 Banks</option>
            <option value="fintech">🚀 Fintechs</option>
            <option value="ai">🤖 AI & Tech</option>
            <option value="regulation">⚖️ Regulation</option>
            <option value="risk">🛡️ Fraud, Risk & Cyber</option>
            <option value="transaction-banking">💰 Transaction Banking</option>
            <option value="markets">📈 Economy & Markets</option>
            <option value="digital-assets">🪙 Digital Money & Assets</option>
            <option value="strategy">🏢 Corporate Strategy & M&A</option>
            <option value="leadership">💼 Leadership & Management</option>
          </select>
        </label>

        <label class="select-wrap">
          <span class="sr-only">Region</span>
          <select id="regionSelect">
            <option value="all" selected>🌎 All regions</option>
            <option value="canada">🇨🇦 Canada</option>
            <option value="us">🇺🇸 US</option>
            <option value="mexico">🇲🇽 Mexico</option>
            <option value="chile">🇨🇱 Chile</option>
          </select>
        </label>
      </div>

      <div class="period-tabs" role="tablist" aria-label="Period">
        <button class="period-btn active" data-period="today">Today</button>
        <button class="period-btn" data-period="7d">7 Days</button>
        <button class="period-btn" data-period="30d">30 Days</button>
      </div>
    </section>

    <section class="section-block">
      <div class="section-title-row">
        <h2>🔥 Must know</h2>
        <span id="contextLabel">Payments · Today</span>
      </div>
      <div id="mustKnowList" class="card-stack"></div>
    </section>

    <section class="section-block">
      <div class="section-title-row">
        <h2>🧭 Strategy</h2>
        <span>Direction & competition</span>
      </div>
      <div id="strategyList" class="card-stack compact"></div>
    </section>

    <section class="section-block">
      <div class="section-title-row">
        <h2>⚙️ Infrastructure</h2>
        <span>Rails & platforms</span>
      </div>
      <div id="infrastructureList" class="card-stack compact"></div>
    </section>

    <section class="section-block">
      <div class="section-title-row">
        <h2>🛠️ Operations</h2>
        <span>Execution & risk</span>
      </div>
      <div id="operationsList" class="card-stack compact"></div>
    </section>

    <section class="section-block bottom-space">
      <div class="section-title-row">
        <h2>👀 Worth watching</h2>
        <span>Early signals</span>
      </div>
      <div id="watchingList" class="card-stack compact"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <button class="nav-item active">⭐<span>Today</span></button>
    <button class="nav-item">📰<span>Briefing</span></button>
    <button class="nav-item">🔖<span>Saved</span></button>
    <button class="nav-item">⚙️<span>Settings</span></button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
